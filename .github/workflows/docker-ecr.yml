name: CloudCart CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Debug OIDC
    uses: github/actions-oidc-debugger@main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: arn:aws:iam::729005487887:role/CloudCart-GitHub-Actions-Role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t cloudcart .

      - name: Tag Docker image
        run: |
          docker tag cloudcart:latest 729005487887.dkr.ecr.ap-south-1.amazonaws.com/cloudcart:latest

      - name: Push Docker image to ECR
        run: |
          docker push 729005487887.dkr.ecr.ap-south-1.amazonaws.com/cloudcart:latest